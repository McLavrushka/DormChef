name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Flake8
        run: poetry run flake8 .

      - name: Bandit
        run: poetry run bandit -r . -ll

      - name: Radon CC (report only)
        run: poetry run radon cc backend frontend -s -a
        continue-on-error: true

      # Numeric CC gate: strictly < 10 (default max allowed = 9).
      - name: Cyclomatic complexity (numeric gate)
        run: poetry run python scripts/check_max_cc.py

      - name: Radon MI
        run: |
            poetry run radon mi . -s
            echo "--- Numeric scores ---"
            poetry run radon mi . --json | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            scores = [v['mi'] for v in data.values()]
            avg = sum(scores) / len(scores) if scores else 0
            print(f'Average MI: {avg:.1f}')
            print('PASS' if avg >= 65 else 'WARNING: below 65')
            "
        continue-on-error: true

      - name: Tests + Coverage
        run: poetry run pytest --cov=. --cov-fail-under=70

      - name: Check OpenAPI docs
        run: |
            poetry run python -c "
            import sys
            from backend.main import app

            schema = app.openapi()
            paths = schema.get('paths', {})
            missing = []

            for path, methods in paths.items():
                for method, details in methods.items():
                    if method in ['get','post','put','delete','patch']:
                        if not details.get('summary') and not details.get('description'):
                            missing.append(f'{method.upper()} {path}')

            if missing:
                print('FAIL: endpoints without documentation:')
                for e in missing: print(f'  {e}')
                sys.exit(1)
            else:
                print(f'PASS: all {sum(len(v) for v in paths.values())} endpoints documented')
            "
