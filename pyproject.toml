[tool.poetry]
name = "dormchef"
version = "0.1.0"
description = "Recipe sharing app for students"
authors = ["DormChef Team"]
readme = "README.md"
package-mode = false 

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
streamlit = "^1.33.0"
httpx = "^0.27.0"
sqlalchemy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
flake8 = "^7.0.0"
bandit = "^1.7.0"
radon = "^6.0.0"
mutmut = "3.5.0"
hypothesis = "^6.100.0"
locust = "^2.24.0"
selenium = "^4.20.0"
pre-commit = "^4.5.1"

[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", ".venv"]

[tool.coverage.run]
omit = [
    "locustfile.py",
    "tests/test_e2e.py",
    "frontend/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# mutmut 3 reads `[tool.mutmut]` only.
[tool.mutmut]
paths_to_mutate = ["backend/search.py"]
also_copy = ["backend"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--ignore=tests/test_e2e.py", "--assert=plain"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
